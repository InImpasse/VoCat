name: docker-publishing-disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publishing-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Public publishing is disabled
        shell: bash
        run: |
          echo "::error title=Publishing disabled::Build reviewed commits locally with scripts/build-hardened.sh; this workflow cannot publish container images."
          exit 1
