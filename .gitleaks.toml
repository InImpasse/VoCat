title = "VoCat secret scanning policy"
minVersion = "8.30.1"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Tailscale public APT signing key fingerprint"
  condition = "AND"
  regexTarget = "match"
  paths = ['''(^|/)scripts/prepare-vocat-guest\.sh$''']
  regexes = ['''^TAILSCALE_KEY_FINGERPRINT=2596A99E(AAB33821)(893C0A79)(458CA832)(957F5868)$''']
