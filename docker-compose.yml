# Development-only local Compose profile. Production runs the verified binary
# under deploy/vocat.service inside the dedicated VM.

services:
  vocat:
    image: vocat-hardened:local
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vocat-hardened-local
    restart: unless-stopped
    network_mode: host

    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run:size=16m,mode=0755
      - /tmp:size=64m,mode=1777

    environment:
      VOCAT_CONTAINER: docker
      VOCAT_ADDR: 0.0.0.0:7575
      VOCAT_DATABASE_PATH: /opt/vocat/data/vocat.db

    volumes:
      - vocat-data:/opt/vocat/data
      - /sys:/sys:ro

    # Add only reviewed, stable device nodes for local hardware testing. Never
    # bind the host's entire /dev tree and never enable privileged mode.
    # devices:
    #   - /dev/ttyUSB2:/dev/ttyUSB2
    #   - /dev/cdc-wdm0:/dev/cdc-wdm0

volumes:
  vocat-data:
